[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-for-godot"
version = "0.10.0"
description = "A local, permission-scoped MCP bridge for AI-assisted Godot development"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Encrypted"}]
keywords = ["godot", "mcp", "ai", "game-development", "editor-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.scripts]
mcp-for-godot = "mcp_for_godot.server:main"
mcp-for-godot-capture = "mcp_for_godot.live_capture:main"

[project.urls]
Homepage = "https://github.com/Dev-Encrypted/mcp-for-godot"
Documentation = "https://github.com/Dev-Encrypted/mcp-for-godot/tree/main/docs"
Issues = "https://github.com/Dev-Encrypted/mcp-for-godot/issues"
Source = "https://github.com/Dev-Encrypted/mcp-for-godot"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
